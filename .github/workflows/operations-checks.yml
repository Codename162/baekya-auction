name: Operations checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@1e60f620b9541b0b3c8f7d6d1c2c1f5b2a9a3d5b
        with:
          node-version: 22
      - run: node --test src/operationsChecks.test.js
        working-directory: baekya-auction-app
      - run: npm install --ignore-scripts && npm run build
        working-directory: baekya-auction-app
